name: Deliver EcoLearn notifications
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecolearn-notification-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run scheduled notification delivery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NOTIFICATION_CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$NOTIFICATION_CRON_SECRET"
          # Drain up to 300 deliveries so a classroom announcement does not
          # wait hours behind a single 25-item batch. Fail immediately on errors.
          for batch in $(seq 1 12); do
            curl --fail-with-body --silent --show-error --max-time 120 \
              --request POST \
              --header "Authorization: Bearer $NOTIFICATION_CRON_SECRET" \
              --output "$RUNNER_TEMP/ecolearn-delivery.json" \
              "$SUPABASE_URL/functions/v1/deliver-notifications"
            cat "$RUNNER_TEMP/ecolearn-delivery.json"
            if jq -e '.accepted < 25' "$RUNNER_TEMP/ecolearn-delivery.json" > /dev/null; then
              break
            fi
          done
